<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shark Tank • Live Presentation</title><link rel="stylesheet" href="styles.css"></head><body><main class="container"><header class="top"><div class="brand">◈ SHARK TANK NIGHT <span class="tag good">● LIVE</span></div><div class="flex"><a href="vote.html">Audience vote</a><button class="secondary" onclick="sync()">↻ Refresh</button><button class="ghost" onclick="document.documentElement.requestFullscreen?.()">⛶ Fullscreen</button></div></header><section id="content"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="config.js"></script><script src="core.js"></script><script>
let chosen=null,previousAccepted=new Set();
let audienceQrVisible=sessionStorage.getItem('st_audience_qr_visible')!=='false';
function toggleAudienceQr(){audienceQrVisible=!audienceQrVisible;sessionStorage.setItem('st_audience_qr_visible',String(audienceQrVisible));render()}
function drawAudienceQr(){let node=document.getElementById('audienceQr');if(!node)return;const target=new URL('vote.html',location.href).href;if(typeof QRCode==='function'){new QRCode(node,{text:target,width:220,height:220,colorDark:'#0e182b',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H})}else{node.innerHTML='<div style="color:#0e182b;padding:14px">QR generator unavailable. Use the link below.</div>'}}
function render(){if(!state)return;let s=state.settings,businesses=state.businesses,investors=state.investors,live=lookup(s.active_business,'businesses');if(chosen&&chosen!=='summary'&&!lookup(chosen,'businesses'))chosen=null;let b=chosen?lookup(chosen,'businesses'):live;let offers=state.offers.filter(o=>o.business_id===b?.id),accepted=offers.filter(o=>o.status==='accepted');let recent=accepted.find(o=>!previousAccepted.has(o.id));previousAccepted=new Set(state.offers.filter(o=>o.status==='accepted').map(o=>o.id));let nav=`<div class="flex" style="margin-bottom:14px"><button class="${chosen?'secondary':'success'}" onclick="chosen=null;render()">Follow Live</button>${businesses.map((x,i)=>`<button class="${b?.id===x.id?'':'secondary'}" onclick="chosen='${x.id}';render()">${i+1}. ${safe(x.name)}</button>`).join('')}<button class="secondary" onclick="chosen='summary';render()">Event Summary</button></div>`;
if(chosen==='summary'||(!chosen&&s.presentation_view==='summary')){ $('content').innerHTML=nav+`<div class="hero"><div class="tag">EVENT OVERVIEW</div><div class="h1">Investment Summary</div><div class="muted">${businesses.length} businesses · ${money(state.offers.filter(o=>o.status==='accepted').reduce((a,o)=>a+Number(o.amount),0))} total committed</div></div><div class="grid">${businesses.map(x=>`<div class="card"><h2>${safe(x.name)}</h2><div class="muted">${safe(x.entrepreneur)}</div><div>${state.offers.filter(o=>o.business_id===x.id&&o.status==='accepted').map(dealRow).join('')||'No accepted investments'}</div></div>`).join('')}</div><h2>Audience Star Ratings</h2><div class="grid">${businesses.map(x=>{let v=state.votes.find(z=>z.business_id===x.id);return `<div class="card"><h3>${safe(x.name)}</h3><div class="num" style="color:#fbbf24">${v?.average==null?'Not rated':Number(v.average).toFixed(1)+' ★'}</div><div class="small muted">${v?.count||0} ratings</div></div>`}).join('')}</div><h2>Investor leaderboard</h2><div class="grid">${[...investors].sort((a,b)=>b.invested-a.invested).map(i=>`<div class="card"><h3>${safe(i.name)}</h3><div>${money(i.invested)} invested</div><div class="muted">${money(i.remaining)} remaining</div></div>`).join('')}</div>`;return}
$('content').innerHTML=nav+(!b?`<div class="hero"><div class="tag">WELCOME</div><div class="h1">${safe(s.display_title)}</div><p class="muted">Waiting for the host to publish the first business.</p><div style="margin-top:20px"><button class="secondary" onclick="toggleAudienceQr()">${audienceQrVisible?'Hide':'Show'} Audience Rating QR Code</button></div>${audienceQrVisible?`<div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:22px"><div id="audienceQr" style="padding:14px;background:white;border-radius:14px;min-width:248px;min-height:248px"></div><div><h2>Audience: Rate Each Business!</h2><p>Scan to give every pitch a rating from 1 to 5 stars.</p><a style="font-size:1.15rem;overflow-wrap:anywhere" href="vote.html">live.12one.page/vote.html</a></div></div>`:''}</div>`:`<div class="hero"><div class="between"><span class="tag">${chosen?'PITCH HISTORY':'NOW PITCHING'} · ${safe(s.mode.toUpperCase())}</span><span class="tag ${b.status==='open'&&!s.locked?'good':'bad'}">${s.locked?'PAUSED':b.status==='open'?'OFFERS OPEN':'OFFERS CLOSED'}</span></div><div class="h1">${safe(b.name)}</div><div class="muted" style="font-size:1.15rem">Entrepreneur: ${safe(b.entrepreneur)}</div><p>${safe(b.description)}</p><div class="flex"><span class="tag" style="color:#fbbf24">Audience: ${state.votes.find(x=>x.business_id===b.id)?.average==null?'Not rated':Number(state.votes.find(x=>x.business_id===b.id).average).toFixed(1)+' ★ / 5'} (${state.votes.find(x=>x.business_id===b.id)?.count||0} ratings)</span><span class="tag">${money(b.ask_amount)} requested</span><span class="tag">${safe(b.ask_equity)}% equity offered</span></div></div>${recent&&recent.business_id===b.id?'<div class="card deal flash"><div class="h1">🤝 DEAL CLOSED!</div><p>New investment accepted!</p></div>':''}<div class="grid">${investors.map(i=>{let pending=offers.find(o=>o.investor_id===i.id&&o.status==='pending'),prior=state.offers.filter(o=>o.investor_id===i.id&&o.status==='accepted');return `<div class="card investor">${pending?`<div class="offer"><span class="tag">NEW OFFER</span><strong>${money(pending.amount)} for ${safe(pending.equity)}%</strong><div class="small">${safe(pending.terms||'No additional terms')}</div></div>`:'<div class="small muted">No active offer</div>'}<h2>${safe(i.name)}</h2><div class="muted">${safe(i.title)}</div><div class="num">${money(i.remaining)}</div><div class="small muted">Remaining · ${money(i.invested)} invested</div><hr class="divider"><div class="small muted">PORTFOLIO</div><div class="timeline">${prior.map(o=>`${safe(lookup(o.business_id,'businesses')?.name||'Other mode')} · ${money(o.amount)} (${safe(o.equity)}%)`).join('<br>')||'No accepted deals yet'}</div></div>`}).join('')}</div><h2 style="margin-top:24px">Accepted investments</h2><div class="grid">${accepted.map(dealRow).join('')||'<div class="card muted">Awaiting a deal</div>'}</div>`);if(!b&&audienceQrVisible)drawAudienceQr()};
init();</script></body></html>
