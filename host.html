<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shark Tank • Host Console</title><link rel="stylesheet" href="styles.css"></head><body><main class="container"><header class="top"><div><div class="brand">◈ SHARK TANK NIGHT</div><div class="muted small">HOST CONTROL CENTER</div></div><div class="flex"><a target="_blank" href="presentation.html">Open projector ↗</a><a target="_blank" href="vote.html">Audience voting ↗</a><button class="secondary" onclick="sync()">↻ Refresh</button><button class="ghost" onclick="logout()">Log out</button></div></header><div id="content"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="core.js"></script><script>
let tab='overview',dragId=null;
function render(){if(!state?.admin){$('content').innerHTML=`<div class="card" style="max-width:440px;margin:50px auto"><span class="tag">RESTRICTED</span><h1>Host sign-in</h1><p class="muted">Enter your private admin code configured in the Supabase setup.</p><label>Admin code</label><input id="hostCode" type="password" autocomplete="off" placeholder="Admin code"><button style="margin-top:14px;width:100%" onclick="login()">Unlock Host Console</button></div>`;return}let s=state.settings,b=lookup(s.active_business,'businesses');let tabs=['overview','businesses','investors','offers','settings','history'];$('content').innerHTML=`<div class="between"><div class="flex"><span class="tag ${s.mode==='live'?'good':'bad'}">${s.mode.toUpperCase()} MODE</span><span class="tag ${s.locked?'bad':'good'}">${s.locked?'EVENT PAUSED':'EVENT ACTIVE'}</span></div><button class="${s.locked?'success':'danger'}" onclick="act('admin_lock',{locked:${!s.locked}})">${s.locked?'Resume All Activity':'⏸ Pause All Activity'}</button></div><div class="nav">${tabs.map(x=>`<button class="${x===tab?'active':'secondary'}" onclick="tab='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div id="panel">${({overview:overview,businesses:businesses,investors:investors,offers:offers,settings:settings,history:historyPanel})[tab]()}</div>`}
async function login(){sessionStorage.setItem('st_admin_code',$('hostCode').value);await sync();if(!state?.admin){sessionStorage.removeItem('st_admin_code');toast('Wrong admin code',true)}}
function logout(){sessionStorage.removeItem('st_admin_code');state=null;render()}
const button=(text,action,cl='secondary')=>`<button class="${cl}" onclick="${action.replaceAll('"','&quot;')}">${text}</button>`;
function overview(){let s=state.settings,b=lookup(s.active_business,'businesses'),accepted=section('accepted');return `<div class="grid"><div class="card"><div class="muted">Businesses</div><div class="num">${state.businesses.length}</div></div><div class="card"><div class="muted">Active Investors</div><div class="num">${state.investors.length}</div></div><div class="card"><div class="muted">Total Accepted</div><div class="num">${money(accepted.reduce((n,x)=>n+Number(x.amount),0))}</div></div><div class="card"><div class="muted">Pending Offers</div><div class="num">${section('pending').length}</div></div></div><div class="two" style="margin-top:16px"><div class="card"><h2>Live Presentation Control</h2><p class="muted">You control which pitch appears on the projector. Offer updates appear automatically.</p><label>Publish business to projector</label><select id="activeSelection"><option value="">Welcome / No current pitch</option><option value="__summary__" ${s.presentation_view==='summary'?'selected':''}>★ Event Summary / Closing Screen</option>${state.businesses.map(x=>`<option value="${x.id}" ${s.presentation_view!=='summary'&&b?.id===x.id?'selected':''}>${safe(x.name)} — ${safe(x.entrepreneur)}</option>`).join('')}</select><div class="flex" style="margin-top:12px">${button('📺 Publish to Screen',`publishSelected()`,'success')}${b?button('Open Offers',`act('admin_pitch_status',{id:'${b.id}',status:'open'})`,'success'):''}${b?button('Close Offers',`act('admin_pitch_status',{id:'${b.id}',status:'closed'})`,'danger'):''}</div><hr class="divider"><div class="tag">CURRENT PITCH</div><h2 style="margin-top:10px">${safe(b?.name||'None published')}</h2><div class="muted">${b?`${safe(b.entrepreneur)} · ${b.status.toUpperCase()}`:'Choose a business above'}</div></div><div class="card"><h2>Quick Actions</h2><div class="stack">${button('＋ Create Business',`tab='businesses';render();businessForm()`)}${button('＋ Invite Investor',`tab='investors';render();addInvestor()`)}${button('Manage Pending Offers',`tab='offers';render()`)}<div class="muted small">Presentation viewers can switch to history or summary independently; the published live business remains unchanged.</div></div></div></div><div class="card" style="margin-top:16px"><h2>Latest Pending Offers</h2>${section('pending').slice(-8).reverse().map(o=>offerCard(o)).join('')||'<p class="muted">No pending offers</p>'}</div>`}
async function publishSelected(){let id=document.getElementById('activeSelection').value;await act(id==='__summary__'?'admin_show_summary':'admin_publish',id==='__summary__'?{}:{id})}
function businesses(){return `<div class="between"><div><h2 class="h2">Businesses</h2><div class="muted small">Drag to reorder. Each idea is a separate business, even if entrepreneurs repeat.</div></div>${button('＋ New Business','businessForm()','success')}</div><div class="stack" style="margin-top:14px">${state.businesses.map((b,i)=>`<div class="rowitem between" draggable="true" ondragstart="dragId='${b.id}'" ondragover="event.preventDefault()" ondrop="event.preventDefault();dropBusiness('${b.id}')"><div><div class="small muted">☰ ${i+1} · ${b.status.toUpperCase()} ${state.settings.active_business===b.id?'· ON SCREEN':''}</div><b>${safe(b.name)}</b><div class="small muted">${safe(b.entrepreneur)} · Asking ${money(b.ask_amount)} for ${safe(b.ask_equity)}%</div></div><div class="flex">${button('Edit',`businessForm('${b.id}')`)}${button('Publish',`act('admin_publish',{id:'${b.id}'})`,'success')}${button(b.status==='open'?'Close':'Open',`act('admin_pitch_status',{id:'${b.id}',status:'${b.status==='open'?'closed':'open'}'})`)}${button('Delete',`delBusiness('${b.id}')`,'danger')}</div></div>`).join('')||'<div class="card muted">No businesses in this mode yet.</div>'}</div>`}
async function dropBusiness(target){if(!dragId||dragId===target)return;let ids=state.businesses.map(b=>b.id),from=ids.indexOf(dragId),to=ids.indexOf(target);ids.splice(to,0,ids.splice(from,1)[0]);try{for(let i=0;i<ids.length;i++)await api('admin_reorder',{id:ids[i],order:i},'admin');await sync()}catch(e){toast(e.message,true)}dragId=null}
function modal(html){let el=document.createElement('div');el.className='modal';el.id='editModal';el.innerHTML=`<div class="dialog">${html}<div class="flex" style="margin-top:18px"><button class="secondary" onclick="document.getElementById('editModal').remove()">Cancel</button></div></div>`;document.body.append(el)}
function businessForm(id){let b=lookup(id,'businesses')||{};modal(`<h2>${id?'Edit':'New'} Business Idea</h2><label>Business / Invention</label><input id="bn" value="${safe(b.name||'')}"><label>Entrepreneur</label><input id="be" value="${safe(b.entrepreneur||'')}"><label>Description</label><textarea id="bd">${safe(b.description||'')}</textarea><label>Asking investment ($)</label><input id="ba" type="number" min="0" value="${b.ask_amount||0}"><label>Equity offered (%)</label><input id="bq" type="number" min="0" max="100" step="0.01" value="${b.ask_equity||0}"><button style="margin-top:15px" onclick="saveBusiness('${id||''}')">Save Business</button>`)}
async function saveBusiness(id){let o={name:$('bn').value,entrepreneur:$('be').value,description:$('bd').value,ask_amount:Number($('ba').value),ask_equity:Number($('bq').value)};if(!o.name.trim()||!o.entrepreneur.trim()){toast('Business and entrepreneur are required',true);return}try{await api(id?'admin_edit_business':'admin_add_business',id?{...o,id}:o,'admin');$('editModal').remove();await sync()}catch(e){toast(e.message,true)}}
async function delBusiness(id){if(confirm('Permanently delete this business, its offers, and votes?'))await act('admin_delete_business',{id})}
function investors(){let codes=state.investor_codes||[];return `<div class="between"><div><h2>Investor Management</h2><p class="muted">Each invitation code works across multiple devices. Keep codes private.</p></div>${button('＋ Add Investor','addInvestor()','success')}</div><div class="grid">${state.investors.map(i=>{let x=codes.find(x=>x.id===i.id);let url=new URL('investor.html',location.href);url.searchParams.set('code',x?.code||'');return `<div class="card"><div class="between"><h2>${safe(i.name)}</h2><span class="tag">${i.enabled?'ACTIVE':'DISABLED'}</span></div><div class="muted">${safe(i.title)}</div><p><b>${money(i.remaining)}</b> remaining · ${money(i.invested)} invested</p><div class="small muted">Invitation code</div><div class="rowitem"><code>${safe(x?.code)}</code></div><div class="flex">${button('Copy Link',`copyText(${JSON.stringify(url.href)})`)}${button('Copy Code',`copyText(${JSON.stringify(x?.code||'')})`)}${button('Edit',`editInvestor('${i.id}')`)}${button('New Code',`regen('${i.id}')`,'danger')}${button(i.enabled?'Disable':'Enable',`act('admin_update_investor',{id:'${i.id}',enabled:${!i.enabled}})`,'secondary')}</div></div>`}).join('')||'<div class="card muted">No investors yet. Add your first Shark!</div>'}</div>`}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied to clipboard')}catch(e){toast('Copy failed: '+e.message,true)}}
async function addInvestor(){let name=prompt('Investor name:');if(name?.trim())await act('admin_add_investor',{name:name.trim()})}
function editInvestor(id){let i=lookup(id,'investors');modal(`<h2>Edit Investor</h2><label>Investor Name</label><input id="in" value="${safe(i.name)}"><label>Personality Title</label><input id="it" value="${safe(i.title)}"><button style="margin-top:15px" onclick="saveInvestor('${id}')">Save</button>`)}
async function saveInvestor(id){await act('admin_update_investor',{id,name:$('in').value,title:$('it').value});$('editModal')?.remove()}
async function regen(id){if(confirm('Regenerate this invitation code? Old code will immediately stop working for new actions.'))await act('admin_regenerate_code',{id})}
function offerCard(o){let i=lookup(o.investor_id,'investors'),b=lookup(o.business_id,'businesses');return `<div class="rowitem"><div class="between"><div><b>${safe(i?.name||'Investor')} → ${safe(b?.name||'Business')}</b><div style="font-size:1.15rem;margin:5px 0"><strong>${money(o.amount)} for ${safe(o.equity)}%</strong></div><div>${safe(o.terms||'No additional terms')}</div><div class="small muted">${safe(o.status.toUpperCase())} · ${date(o.created_at)}</div></div><div class="flex">${o.status==='pending'?button('✓ Accept',`offerStatus('${o.id}','accepted')`,'success')+button('✕ Reject',`offerStatus('${o.id}','rejected')`,'danger'):''}${o.status==='accepted'?button('↶ Undo Deal',`offerStatus('${o.id}','pending')`,'danger'):''}</div></div></div>`}
async function offerStatus(id,status){if(status==='accepted'&&!confirm('Accept this investment and deduct its amount from the investor budget?'))return;if(status==='pending'&&!confirm('Undo this accepted deal? The money will be restored and the offer returned to pending.'))return;await act('admin_offer_status',{id,status})}
function offers(){return `<h2>Offer Management</h2><p class="muted">Investors may have one pending offer per business. Only accepted investments deduct funds.</p><h3>Pending Offers (${section('pending').length})</h3>${section('pending').map(offerCard).join('')||'<div class="card muted">No pending offers</div>'}<h3>Accepted Deals (${section('accepted').length})</h3>${section('accepted').map(offerCard).join('')||'<div class="card muted">No accepted deals</div>'}<h3>Rejected / Withdrawn</h3>${state.offers.filter(o=>['rejected','withdrawn'].includes(o.status)).map(offerCard).join('')||'<div class="card muted">None</div>'}`}
function settings(){let s=state.settings;return `<div class="two"><div class="card"><h2>Event Settings</h2><label>Event Title</label><input id="eventTitle" value="${safe(s.display_title)}"><label>Universal Starting Budget ($)</label><input id="budget" type="number" min="0" value="${s.starting_budget}"><p class="muted small">Changing the budget affects every investor. Avoid changing it after deals are accepted.</p>${button('Save Settings',`act('admin_save_settings',{display_title:document.getElementById('eventTitle').value,starting_budget:Number(document.getElementById('budget').value)})`,'success')}</div><div class="card"><h2>Rehearsal & Live Mode</h2><p>Current: <span class="tag">${s.mode.toUpperCase()}</span></p><p class="muted">Business ideas, offers, and votes are separated by mode. Investor names/codes and the starting budget are shared. Changing mode clears the current projection selection.</p><div class="flex">${button('Switch to Rehearsal',`setMode('test')`)}${button('Switch to LIVE',`setMode('live')`,'success')}</div><hr class="divider"><div class="stack">${button('Reset Current Mode Offers & Votes',`resetMode()`,'danger')}${button('Delete All Rehearsal Businesses',`clearTest()`,'danger')}</div></div></div><div class="card" style="margin-top:16px"><h2>Exports</h2><div class="flex">${button('Investors CSV',`csv('investors-${s.mode}',state.investors)`)}${button('Businesses CSV',`csv('businesses-${s.mode}',state.businesses)`)}${button('Offers CSV',`csv('offers-${s.mode}',state.offers)`)}${button('Accepted Deals CSV',`csv('deals-${s.mode}',section('accepted'))`)}${button('Audience Votes CSV',`csv('votes-${s.mode}',state.votes)`)}${button('Activity Log CSV',`csv('log',state.logs||[])`)}</div></div>`}
async function setMode(mode){if(confirm(`Switch to ${mode.toUpperCase()} mode? The projected event and all dashboards will follow the new mode.`))await act('admin_mode',{mode})}
async function resetMode(){if(confirm('Delete ALL offers and audience votes in the current mode? Business ideas will remain.'))await act('admin_reset_mode')}
async function clearTest(){if(confirm('Permanently delete every rehearsal business, offer, and vote?'))await act('admin_clear_test')}
function historyPanel(){return `<h2>Event History & Leaderboard</h2><div class="grid">${[...state.investors].sort((a,b)=>b.invested-a.invested).map(i=>`<div class="card"><h3>${safe(i.name)}</h3><div class="num">${money(i.invested)}</div><div class="muted">${money(i.remaining)} remaining</div></div>`).join('')}</div><h2 style="margin-top:22px">People's Choice Voting</h2><div class="grid">${state.businesses.map(b=>`<div class="card"><h3>${safe(b.name)}</h3><div class="num" style="color:#fbbf24">${state.votes.find(v=>v.business_id===b.id)?.average==null?'Not rated':Number(state.votes.find(v=>v.business_id===b.id).average).toFixed(1)+' ★ / 5'}</div><div class="muted small">${state.votes.find(v=>v.business_id===b.id)?.count||0} ratings</div></div>`).join('')}</div><h2 style="margin-top:22px">Accepted Investments</h2>${section('accepted').map(dealRow).join('')||'<div class="card muted">No accepted investments</div>'}<h2 style="margin-top:22px">Admin Activity Log</h2><div class="scroll"><table><thead><tr><th>Time</th><th>Action</th><th>Details</th></tr></thead><tbody>${(state.logs||[]).map(x=>`<tr><td>${date(x.at)}</td><td>${safe(x.action)}</td><td>${safe(JSON.stringify(x.details).slice(0,190))}</td></tr>`).join('')}</tbody></table></div>`}
init();</script></body></html>
