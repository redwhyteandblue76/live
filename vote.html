<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shark Tank • Audience Vote</title><link rel="stylesheet" href="styles.css"></head><body><main class="container" style="max-width:760px"><div class="brand">◈ SHARK TANK NIGHT</div><div class="hero" style="margin-top:20px"><span class="tag">PEOPLE'S CHOICE</span><h1>Rate the Pitches</h1><p class="muted">Give each business 1–5 stars. Your rating for every business is saved separately, and you can change it anytime on this device.</p></div><section id="content"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="core.js"></script><script>
function ratingFor(id){return (state.my_ratings||[]).find(r=>r.business_id===id)?.rating||0}
function ratingStats(id){return (state.votes||[]).find(r=>r.business_id===id)}
function render(){if(!state)return;$('content').innerHTML='<div class="stack">'+state.businesses.map(b=>{
const mine=ratingFor(b.id),stats=ratingStats(b.id);
return `<div class="card"><div class="between"><div><h2>${safe(b.name)}</h2><div class="muted">${safe(b.entrepreneur)}</div><div class="small">${safe(b.description)}</div></div><div style="text-align:right"><strong>${stats?.average===undefined?'Not rated':Number(stats.average).toFixed(1)+' / 5'}</strong><div class="small muted">${stats?.count||0} ratings</div></div></div><div style="margin-top:14px" class="small muted">${mine?'Your rating: '+mine+' of 5 stars':'Choose your rating'}</div><div class="flex" style="gap:6px;margin-top:6px" aria-label="Rate ${safe(b.name)} 1 to 5 stars">${[1,2,3,4,5].map(n=>`<button class="secondary" style="font-size:1.6rem;min-width:46px;padding:8px;color:${n<=mine?'#fbbf24':'#8ea0b9'}" aria-label="${n} stars" aria-pressed="${n===mine}" onclick="rate('${b.id}',${n})">${n<=mine?'★':'☆'}</button>`).join('')}</div><div class="small muted" style="margin-top:7px">${mine?'✓ Your '+mine+'-star rating is saved. Tap a different star to update.':'You have not rated this business yet.'}</div></div>`}).join('')+'</div>'}
async function rate(id,rating){try{await api('rate',{business_id:id,rating});await sync();toast('Your '+rating+'-star rating was saved')}catch(e){toast(e.message,true)}}
init();</script></body></html>
