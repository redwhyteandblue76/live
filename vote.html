<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shark Tank • Audience Vote</title><link rel="stylesheet" href="styles.css"></head><body><main class="container" style="max-width:760px"><div class="brand">◈ SHARK TANK NIGHT</div><div class="hero" style="margin-top:20px"><span class="tag">PEOPLE'S CHOICE</span><h1>Cast Your Vote</h1><p class="muted">Choose your favorite business. You can change your vote during the event; the last selection counts. One vote per browser session account.</p></div><section id="content"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="core.js"></script><script>function render(){if(!state)return;$('content').innerHTML='<div class="stack">'+state.businesses.map(b=>`<div class="card between"><div><h2>${safe(b.name)}</h2><div class="muted">${safe(b.entrepreneur)}</div><div class="small">${safe(b.description)}</div></div><button onclick="vote('${b.id}')">Vote</button></div>`).join('')+'</div>'}async function vote(id){if(confirm('Vote for this business?'))await act('vote',{business_id:id},'')}init();</script></body></html>
