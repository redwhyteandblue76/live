<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shark Tank • Investor</title><link rel="stylesheet" href="sharkstyles.css"></head><body><main class="container"><header class="top"><div class="brand">◈ SHARK TANK <span class="muted">INVESTOR</span></div><div class="flex"><a href="sharkpresentation.html">Public screen</a><button class="secondary" onclick="sync()">↻ Refresh</button><button class="ghost" onclick="logout()">Log out</button></div></header><div id="content"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="sharkconfig.js"></script><script src="sharkcore.js"></script><script>
// Keep unsent offers per business even when live data refreshes.
let draftBusinessId=null;
const offerDrafts=new Map();
function captureOfferDraft(){
  if(!draftBusinessId)return;
  const amount=$('amount'),equity=$('equity'),terms=$('terms');
  if(amount&&equity&&terms)offerDrafts.set(draftBusinessId,{amount:amount.value,equity:equity.value,terms:terms.value});
}
function focusSnapshot(){
  const el=document.activeElement;
  if(!el||!['amount','equity','terms'].includes(el.id))return null;
  let start=null,end=null;
  try{start=el.selectionStart;end=el.selectionEnd}catch(e){}
  return {id:el.id,start,end};
}
function restoreFocus(snapshot){
  if(!snapshot)return;
  const el=$(snapshot.id);
  if(!el)return;
  el.focus({preventScroll:true});
  if(snapshot.start!==null)try{el.setSelectionRange(snapshot.start,snapshot.end)}catch(e){}
}
function render(){const previousBusiness=draftBusinessId;const focus=focusSnapshot();captureOfferDraft();let c=code(),me=state?.investors?.find(i=>i.id===state.me),b=lookup(state?.settings?.active_business,'businesses');if(!c||!me){$('content').innerHTML=`<div class="card" style="max-width:480px;margin:55px auto"><div class="tag">INVESTOR ACCESS</div><h1>Welcome, Shark.</h1><p class="muted">Enter the unique access code provided by the event host. No account or password required.</p><label>Investor code</label><input id="loginCode" value="${safe(new URLSearchParams(location.search).get('code')||'')}" placeholder="Enter your code" autocomplete="off"><button style="width:100%;margin-top:15px" onclick="login()">Enter Investor Dashboard</button></div>`;return}let myOffers=state.offers.filter(o=>o.investor_id===me.id),current=myOffers.find(o=>o.business_id===b?.id&&o.status==='pending');let allowed=b?.status==='open'&&!state.settings.locked;draftBusinessId=b?.id||null;const draft=b?offerDrafts.get(b.id):null;let mine=myOffers.filter(o=>o.status==='accepted');$('content').innerHTML=`<div class="between"><div><span class="tag good">SIGNED IN</span><h1>${safe(me.name)}</h1><div class="muted">${safe(me.title||'Investor')}</div></div><button class="secondary" onclick="changeTitle()">Edit personality title</button></div><div class="grid"><div class="card"><div class="muted small">Funds remaining</div><div class="num">${money(me.remaining)}</div></div><div class="card"><div class="muted small">Total invested</div><div class="num">${money(me.invested)}</div></div><div class="card"><div class="muted small">Accepted deals</div><div class="num">${mine.length}</div></div></div><div class="two" style="margin-top:16px"><div class="card"><div class="tag">CURRENT BUSINESS</div><h2 class="h1">${safe(b?.name||'No active business')}</h2><div class="muted">${safe(b?.entrepreneur||'Waiting for host')}</div><p>${safe(b?.description||'')}</p>${b?`<div class="flex"><span class="tag">Asking ${money(b.ask_amount)}</span><span class="tag">${safe(b.ask_equity)}% offered</span></div>`:''}<hr class="divider"><span class="tag ${allowed?'good':'bad'}">${allowed?'ACCEPTING OFFERS':'OFFERS CLOSED'}</span>${current?`<div class="offer" style="margin-top:15px"><strong>Your live offer: ${money(current.amount)} for ${safe(current.equity)}%</strong><div>${safe(current.terms||'No extra terms')}</div><button class="danger" style="margin-top:12px" onclick="withdraw()" ${!allowed?'disabled':''}>Withdraw offer</button></div>`:''}${allowed?`<h3>${current?'Revise your offer':'Make an offer'}</h3><label>Amount ($)</label><input id="amount" type="number" min="1" step="0.01" value="${safe(draft?.amount??current?.amount??'')}"><label>Equity (%)</label><input id="equity" type="number" min="0" max="100" step="0.01" value="${safe(draft?.equity??current?.equity??'')}"><label>Additional terms</label><textarea id="terms" maxlength="500">${safe(draft?.terms??current?.terms??'')}</textarea><button style="margin-top:12px;width:100%" onclick="submitOffer()">${current?'Replace Live Offer':'Submit Offer'}</button>`:''}</div><div class="card"><h2>My Portfolio & Offer History</h2>${myOffers.length?myOffers.slice().reverse().map(dealRow).join(''):'<p class="muted">No offers yet.</p>'}</div></div>`;if(previousBusiness===draftBusinessId&&allowed)restoreFocus(focus)}
async function login(){let v=$('loginCode').value.trim().toUpperCase();try{await api('investor_login',{code:v});localStorage.setItem('st_investor_code',v);history.replaceState(null,'',location.pathname);await sync()}catch(e){toast(e.message,true)}}
function logout(){localStorage.removeItem('st_investor_code');offerDrafts.clear();draftBusinessId=null;state=null;render()}
async function submitOffer(){const b=lookup(state.settings.active_business,'businesses');if(!b)return;captureOfferDraft();try{await api('investor_offer',{business_id:b.id,amount:Number($('amount').value),equity:Number($('equity').value),terms:$('terms').value},'investor');offerDrafts.delete(b.id);await sync();toast('Offer submitted successfully')}catch(e){toast(e.message,true)}}
async function withdraw(){let b=lookup(state.settings.active_business,'businesses');if(b&&confirm('Withdraw your pending offer?'))await act('investor_withdraw',{business_id:b.id},'investor')}
async function changeTitle(){let x=prompt('Choose your Shark personality title (up to 80 characters):',state.investors.find(i=>i.id===state.me)?.title||'');if(x!==null)await act('investor_profile',{title:x},'investor')}
init();</script></body></html>
